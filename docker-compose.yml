services:
  backend:
    build: .
    container_name: panoramdle_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - panoramdle-network

  db:
    image: postgres:16
    container_name: panoramdle_db
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - panoramdle_db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - panoramdle-network

volumes:
  panoramdle_db_data:
    name: panoramdle_db_data

networks:
  panoramdle-network:
    name: panoramdle-network
    driver: bridge