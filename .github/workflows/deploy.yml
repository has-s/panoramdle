# .github/workflows/deploy.yml
name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Ручной запуск

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          cd ${{ secrets.PROJECT_PATH }}
          
          # Pull latest changes
          git pull origin main
          
          # Run deployment script (с автоматическим бэкапом)
          chmod +x scripts/*.sh
          ./scripts/deploy.sh
          
          echo "✓ Deployment completed"
          echo "Latest backup: $(ls -t backups/ | head -1)"

    - name: Health check
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          cd ${{ secrets.PROJECT_PATH }}
          
          # Загрузить порт из .env.docker
          source .env.docker
          BACKEND_PORT=${BACKEND_PORT:-8000}
          
          # Ждем готовности backend (до 60 секунд)
          echo "Waiting for backend to be ready on port $BACKEND_PORT..."
          for i in {1..12}; do
            if curl -f http://localhost:$BACKEND_PORT/health > /dev/null 2>&1; then
              echo "✓ Backend is healthy!"
              break
            fi
            echo "Attempt $i/12..."
            sleep 5
          done
          
          # Финальная проверка
          if ! curl -f http://localhost:$BACKEND_PORT/health; then
            echo "✗ Health check failed!"
            docker-compose logs --tail=50 backend
            exit 1
          fi
          
          echo "✓ Deployment successful!"

    - name: Notify on failure
      if: failure()
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          cd ${{ secrets.PROJECT_PATH }}
          
          echo "Deployment failed! Attempting rollback..."
          ./scripts/rollback.sh || true
          
          # Show logs for debugging
          docker-compose logs --tail=50 backend