<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Добавить новость</title>
<style>
:root {
  --color-bg: #fffcf2;
  --color-bg-sub: #ccc5b9;
  --color-text: #252422;
  --color-text-sub: #403d39;
  --color-contrast: #c1292e;
}

body {
  background-color: var(--color-bg);
  color: var(--color-text);
  font-family: sans-serif;
  display: flex;
  gap: 20px;
  padding: 20px;
}

.column {
  flex: 1;
  max-width: 600px;
}

input, textarea, select {
  width: 100%;
  box-sizing: border-box;
  background-color: var(--color-bg-sub);
  color: var(--color-text);
  border: 1px solid var(--color-text-sub);
  padding: 6px;
  margin-bottom: 10px;
}

button {
  background-color: var(--color-contrast);
  color: var(--color-bg);
  border: none;
  padding: 8px 16px;
  cursor: pointer;
}

#news-form, #after-submit, #preview {
  display: none;
}

.preview-card {
  display: flex;
  flex-direction: column;
  width: 100%;
  min-height: 200px;
  border: 2px solid var(--color-text-sub);
  box-shadow: 2px 2px 0 var(--color-text-sub), 4px 4px 0 var(--color-bg-sub);
  padding: 16px;
  background-color: var(--color-bg-sub);
  border-radius: 6px;
}

.preview-media-wrapper img {
  width: 100%;
  max-height: 200px;
  object-fit: cover;
  margin-bottom: 8px;
  border-radius: 4px;
}

.preview-card h3 {
  margin: 0 0 8px 0;
}

.preview-footer {
  margin-top: auto;
  display: flex;
  justify-content: space-between;
}

.real-fake {
  font-weight: bold;
  color: var(--color-contrast);
}
</style>
</head>
<body>

<div class="column">
  <h2 id="title">Войти</h2>

  <form id="auth-form">
    <input type="password" name="password" placeholder="Пароль">
    <button type="submit">Войти</button>
  </form>
  <p id="auth-result"></p>

  <form id="news-form">
    <input type="hidden" name="password" id="saved-password">
    <input type="text" name="headline" placeholder="Заголовок" required>
    <textarea name="text" placeholder="Текст"></textarea>
    <input type="text" name="media_url" placeholder="Ссылка на изображение">
    <input type="text" name="source_name" placeholder="Источник" required>
    <select name="format">
      <option value="txt">txt</option>
      <option value="img">img</option>
      <option value="img_txt">img_txt</option>
    </select>
    <label>
      <input type="checkbox" id="is_real_checkbox">
      Реальная новость
    </label>
    <input type="hidden" name="is_real" id="is_real_hidden" value="false"><br>
    <button type="submit">Добавить</button>
  </form>

  <div id="after-submit">
    <p>Новость добавлена!</p>
    <button id="add-another">Отправить ещё</button>
  </div>
</div>

<div class="column" id="preview">
  <div class="preview-card">
    <h3 id="preview-headline"></h3>
    <div class="preview-media-wrapper">
      <img id="preview-media" src="" alt="">
    </div>
    <p id="preview-text"></p>
    <div class="preview-footer">
      <p class="real-fake" id="preview-is-real"></p>
      <p id="preview-source"></p>
    </div>
  </div>
</div>

<script src="/static/js/test_addnews.js"></script>
</body>
</html>
