<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panoramdle - Daily Challenge</title>
    <style>
        :root {
            --color-bg: #fffcf2;
            --color-bg-sub: #ccc5b9;
            --color-text: #252422;
            --color-text-sub: #403d39;
            --color-contrast: #c1292e;
            --color-success: #2d6a4f;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }

        .welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .welcome-modal {
            background: var(--color-bg);
            border-radius: 12px;
            padding: 40px;
            max-width: 500px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .welcome-modal h1 {
            color: var(--color-text);
            margin: 0 0 20px 0;
            font-size: 36px;
        }

        .welcome-modal p {
            color: var(--color-text-sub);
            font-size: 18px;
            line-height: 1.6;
            margin: 0 0 30px 0;
        }

        .welcome-rules {
            background: var(--color-bg-sub);
            border-radius: 8px;
            padding: 20px;
            margin: 0 0 30px 0;
            text-align: left;
        }

        .welcome-rules h3 {
            color: var(--color-text);
            margin: 0 0 15px 0;
            font-size: 20px;
        }

        .welcome-rules ul {
            margin: 0;
            padding-left: 20px;
        }

        .welcome-rules li {
            color: var(--color-text-sub);
            margin: 10px 0;
            font-size: 16px;
        }

        .start-button {
            background: var(--color-contrast);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .start-button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .hidden {
            display: none;
        }

        #daily-container {
            max-width: 700px;
            margin: 0 auto;
            text-align: center;
        }

        .moderator-panel {
            background: var(--color-text-sub);
            color: var(--color-bg);
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .copy-button {
            background: var(--color-contrast);
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }

        .copy-button:hover {
            opacity: 0.8;
        }

        .progress {
            margin-bottom: 20px;
            font-size: 18px;
            color: var(--color-text-sub);
        }

        .news-card {
            background-color: var(--color-bg-sub);
            border: 2px solid var(--color-text-sub);
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 3px 3px 0 var(--color-text-sub);
        }

        .news-card h2 {
            margin: 0 0 15px 0;
            font-size: 24px;
        }

        #media {
            max-width: 100%;
            max-height: 400px;
            border-radius: 6px;
            margin: 15px 0;
            display: none;
        }

        #media.visible {
            display: block;
        }

        #text {
            font-size: 16px;
            line-height: 1.6;
            margin: 15px 0;
            text-align: left;
        }

        .news-meta {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            font-size: 14px;
            color: var(--color-text-sub);
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #true-btn {
            background-color: var(--color-success);
            color: white;
        }

        #false-btn {
            background-color: var(--color-contrast);
            color: white;
        }

        #continue-btn {
            background-color: var(--color-text-sub);
            color: white;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #answer-result {
            font-weight: bold;
            font-size: 20px;
            margin-top: 15px;
            min-height: 30px;
        }

        #answer-result.correct {
            color: var(--color-success);
        }

        #answer-result.incorrect {
            color: var(--color-contrast);
        }

        .results {
            text-align: center;
            padding: 40px 20px;
        }

        .results h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .score {
            font-size: 48px;
            font-weight: bold;
            color: var(--color-contrast);
            margin: 20px 0;
        }

        #restart-btn {
            background-color: var(--color-contrast);
            color: white;
            margin-top: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 20px;
        }

        .stats-box {
            background: var(--color-bg-sub);
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div id="welcomeOverlay" class="welcome-overlay">
    <div class="welcome-modal">
        <h1>Panoramdle</h1>
        <p>Сможете отличить реальные новости от фейковых?</p>

        <div class="welcome-rules">
            <h3>Правила:</h3>
            <ul>
                <li>10 новостей на сегодня</li>
                <li>Отметьте какие реальные, а какие фейковые</li>
                <li>Узнайте результат в конце</li>
                <li>Один шанс в день!</li>
            </ul>
        </div>

        <button class="start-button" onclick="startChallenge()">Начать</button>
    </div>
</div>

<div id="daily-container" class="hidden">
    <div class="loading">
        <p>Загрузка квиза...</p>
    </div>
</div>

<script>
let dailyData = [];
let currentIndex = 0;
let results = [];
let challengeDate = '';
let isModerator = false;

const containerEl = document.getElementById("daily-container");
const welcomeEl = document.getElementById("welcomeOverlay");

async function checkAuth() {
    try {
        const response = await fetch('/api/auth/me');
        if (response.ok) {
            isModerator = true;
        }
    } catch (error) {
        isModerator = false;
    }
}

function copyNewsId(newsId) {
    navigator.clipboard.writeText(newsId).then(() => {
        const btn = event.target;
        const originalText = btn.innerHTML;
        btn.innerHTML = '✓ Скопировано';
        setTimeout(() => {
            btn.innerHTML = originalText;
        }, 1500);
    }).catch(err => {
        alert('Ошибка копирования: ' + err);
    });
}

function getTodayDate() {
    const today = new Date();
    return today.toISOString().split('T')[0];
}

function hasCompletedToday() {
    const today = getTodayDate();
    return document.cookie.includes(`challenge_${today}=completed`);
}

function setChallengeCompleted() {
    const today = getTodayDate();
    const expires = new Date();
    expires.setHours(23, 59, 59, 999);
    document.cookie = `challenge_${today}=completed; expires=${expires.toUTCString()}; path=/`;
}

function saveProgress() {
    const today = getTodayDate();
    const progress = {
        index: currentIndex,
        results: results,
        date: challengeDate
    };
    const expires = new Date();
    expires.setHours(23, 59, 59, 999);
    document.cookie = `challenge_progress_${today}=${encodeURIComponent(JSON.stringify(progress))}; expires=${expires.toUTCString()}; path=/`;
}

function loadProgress() {
    const today = getTodayDate();
    const cookies = document.cookie.split(';');
    for (let cookie of cookies) {
        const [name, value] = cookie.trim().split('=');
        if (name === `challenge_progress_${today}`) {
            try {
                return JSON.parse(decodeURIComponent(value));
            } catch (e) {
                return null;
            }
        }
    }
    return null;
}

function clearProgress() {
    const today = getTodayDate();
    document.cookie = `challenge_progress_${today}=; path=/; max-age=0`;
}

async function loadTodayStats() {
    try {
        const today = getTodayDate();
        const response = await fetch(`/api/daily/stats?date=${today}`);
        if (response.ok) {
            const stats = await response.json();
            return stats;
        }
    } catch (error) {
        console.error('Failed to load stats:', error);
    }
    return null;
}

function getPeopleWord(count) {
    if (count % 10 === 1 && count % 100 !== 11) return 'человек';
    if ([2, 3, 4].includes(count % 10) && ![12, 13, 14].includes(count % 100)) return 'человека';
    return 'человек';
}

function startChallenge() {
    if (hasCompletedToday()) {
        welcomeEl.innerHTML = `
            <div class="welcome-modal">
                <h1>Panoramdle</h1>
                <p>Вы уже прошли сегодняшний челлендж!</p>
                <p style="color: var(--color-text-sub);">Возвращайтесь завтра за новыми новостями.</p>
            </div>
        `;
        return;
    }

    welcomeEl.classList.add('hidden');
    containerEl.classList.remove('hidden');
    loadChallenge();
}

function setupButtons() {
    const trueBtn = document.getElementById("true-btn");
    const falseBtn = document.getElementById("false-btn");

    if (trueBtn && falseBtn) {
        trueBtn.addEventListener("click", () => answer(true));
        falseBtn.addEventListener("click", () => answer(false));
    }
}

async function loadChallenge() {
    try {
        const response = await fetch("/api/daily");
        if (!response.ok) {
            throw new Error("Ошибка загрузки квиза");
        }

        const data = await response.json();
        dailyData = data.news || [];
        challengeDate = data.challenge_date;

        if (dailyData.length === 0) {
            containerEl.innerHTML = `
                <div class="results">
                    <h2>Нет доступных новостей</h2>
                    <p>Добавьте новости для начала квиза</p>
                </div>
            `;
            return;
        }

        const savedProgress = loadProgress();
        if (savedProgress && savedProgress.date === challengeDate) {
            currentIndex = savedProgress.index;
            results = savedProgress.results;
            console.log('Восстановлен прогресс:', currentIndex, 'вопрос');
        } else {
            currentIndex = 0;
            results = [];
        }

        showQuestion();
    } catch (error) {
        containerEl.innerHTML = `
            <div class="results">
                <h2>Ошибка загрузки</h2>
                <p>${error.message}</p>
            </div>
        `;
    }
}

function showQuestion() {
    const news = dailyData[currentIndex];
    const progress = `Вопрос ${currentIndex + 1} из ${dailyData.length}`;

    let dateStr = "";
    if (news.published_date) {
        const date = new Date(news.published_date);
        dateStr = date.toLocaleDateString('ru-RU');
    }

    containerEl.innerHTML = `
        <div class="progress">${progress}</div>
        <div class="news-card">
            ${isModerator ? `
                <div class="moderator-panel">
                    <span>ID: ${news.id}</span>
                    <button class="copy-button" onclick="copyNewsId('${news.id}')">
                        📋 Копировать
                    </button>
                </div>
            ` : ''}
            <h2>${news.headline}</h2>
            ${news.media_url ? `<img id="media" class="visible" src="${news.media_url}" alt="Изображение новости">` : '<img id="media" src="" alt="">'}
            ${news.text ? `<p id="text">${news.text}</p>` : ''}
            <div class="news-meta" id="news-meta" style="display: none;">
                <span>Источник: ${news.source_name || 'Неизвестно'}</span>
                ${dateStr ? `<span>Дата: ${dateStr}</span>` : ''}
            </div>
        </div>
        <div class="buttons">
            <button id="true-btn">✓ Правда</button>
            <button id="false-btn">✗ Фейк</button>
        </div>
        <p id="answer-result"></p>
    `;

    setupButtons();
}

function answer(isReal) {
    const news = dailyData[currentIndex];
    const correct = isReal === news.is_real;
    results.push(correct);

    const resultEl = document.getElementById("answer-result");
    resultEl.innerText = correct ? "✓ Верно!" : "✗ Неверно!";
    resultEl.className = correct ? "correct" : "incorrect";

    const metaEl = document.getElementById("news-meta");
    if (metaEl) {
        metaEl.style.display = "flex";
    }

    document.getElementById("true-btn").style.display = "none";
    document.getElementById("false-btn").style.display = "none";

    const buttonsDiv = document.querySelector('.buttons');
    const continueBtn = document.createElement('button');
    continueBtn.id = 'continue-btn';
    continueBtn.textContent = currentIndex + 1 < dailyData.length ? 'Продолжить' : 'Завершить';
    continueBtn.onclick = continueToNext;
    buttonsDiv.appendChild(continueBtn);

    currentIndex++;
    saveProgress();
}

function continueToNext() {
    if (currentIndex < dailyData.length) {
        showQuestion();
    } else {
        showResults();
    }
}

async function showResults() {
    const score = results.filter(Boolean).length;
    const total = results.length;
    const percentage = Math.round((score / total) * 100);

    let message = "";
    if (percentage === 100) {
        message = "Идеально!";
    } else if (percentage >= 80) {
        message = "Отлично!";
    } else if (percentage >= 60) {
        message = "Хорошо!";
    } else if (percentage >= 40) {
        message = "Неплохо!";
    } else {
        message = "Попробуйте ещё раз!";
    }

    setChallengeCompleted();
    clearProgress();

    if (isModerator) {
        containerEl.innerHTML = `
            <div class="results">
                <h2>Челлендж завершён!</h2>
                <div class="score">${score} / ${total}</div>
                <p style="font-size: 24px;">${message}</p>
                <p style="font-size: 18px; color: var(--color-text-sub);">
                    Правильных ответов: ${percentage}%
                </p>
                <p style="margin-top: 30px; color: var(--color-text-sub); font-size: 14px;">
                    (Результаты модераторов не учитываются в статистике)
                </p>
                <p style="margin-top: 15px; color: var(--color-text-sub);">
                    Возвращайтесь завтра за новым челленджем!
                </p>
            </div>
        `;
        return;
    }

    try {
        const formData = new FormData();
        formData.append('challenge_date', challengeDate);
        formData.append('correct_count', score);

        const response = await fetch('/api/daily/submit', {
            method: 'POST',
            body: formData
        });

        const stats = await response.json();

        containerEl.innerHTML = `
            <div class="results">
                <h2>Челлендж завершён!</h2>
                <div class="score">${score} / ${total}</div>
                <p style="font-size: 24px;">${message}</p>
                <p style="font-size: 18px; color: var(--color-text-sub);">
                    Правильных ответов: ${percentage}%
                </p>
                ${stats.total_attempts > 1 ? `
                    <div class="stats-box">
                        <p style="font-size: 16px; color: var(--color-text-sub); margin: 0;">
                            Средний результат сегодня: ${stats.average_correct}/10 (${stats.average_percentage}%)<br>
                            Всего прошли: ${stats.total_attempts} ${getPeopleWord(stats.total_attempts)}
                        </p>
                    </div>
                ` : ''}
                <p style="margin-top: 30px; color: var(--color-text-sub);">
                    Возвращайтесь завтра за новым челленджем!
                </p>
            </div>
        `;
    } catch (error) {
        containerEl.innerHTML = `
            <div class="results">
                <h2>Челлендж завершён!</h2>
                <div class="score">${score} / ${total}</div>
                <p style="font-size: 24px;">${message}</p>
                <p style="font-size: 18px; color: var(--color-text-sub);">
                    Правильных ответов: ${percentage}%
                </p>
                <p style="margin-top: 30px; color: var(--color-text-sub);">
                    Возвращайтесь завтра за новым челленджем!
                </p>
            </div>
        `;
    }
}

window.onload = async function() {
    await checkAuth();

    const stats = await loadTodayStats();

    if (hasCompletedToday()) {
        let statsHtml = '';
        if (stats && stats.total_attempts > 0) {
            statsHtml = `
                <div class="stats-box">
                    <p style="font-size: 16px; color: var(--color-text-sub); margin: 0;">
                        Сегодня прошли: ${stats.total_attempts} ${getPeopleWord(stats.total_attempts)}<br>
                        Средний результат: ${stats.average_correct}/10 (${stats.average_percentage}%)
                    </p>
                </div>
            `;
        }

        welcomeEl.innerHTML = `
            <div class="welcome-modal">
                <h1>Panoramdle</h1>
                <p>Вы уже прошли сегодняшний челлендж!</p>
                ${statsHtml}
                <p style="color: var(--color-text-sub); margin-top: ${statsHtml ? '20px' : '0'};">
                    Возвращайтесь завтра за новыми новостями.
                </p>
            </div>
        `;
    } else if (stats && stats.total_attempts > 0) {
        const rulesDiv = document.querySelector('.welcome-rules');
        const statsBox = document.createElement('div');
        statsBox.className = 'stats-box';
        statsBox.innerHTML = `
            <p style="font-size: 14px; color: var(--color-text-sub); margin: 0;">
                Сегодня прошли: ${stats.total_attempts} ${getPeopleWord(stats.total_attempts)}<br>
                Средний результат: ${stats.average_correct}/10 (${stats.average_percentage}%)
            </p>
        `;
        rulesDiv.parentNode.insertBefore(statsBox, rulesDiv.nextSibling);
    }
};
</script>
</body>
</html>
