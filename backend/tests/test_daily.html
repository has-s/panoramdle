<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Daily</title>
    <style>
        :root {
            --color-bg: #fffcf2;
            --color-bg-sub: #ccc5b9;
            --color-text: #252422;
            --color-text-sub: #403d39;
            --color-contrast: #c1292e;
            --color-success: #2d6a4f;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }

        #daily-container {
            max-width: 700px;
            margin: 0 auto;
            text-align: center;
        }

        .progress {
            margin-bottom: 20px;
            font-size: 18px;
            color: var(--color-text-sub);
        }

        .news-card {
            background-color: var(--color-bg-sub);
            border: 2px solid var(--color-text-sub);
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 3px 3px 0 var(--color-text-sub);
        }

        .news-card h2 {
            margin: 0 0 15px 0;
            font-size: 24px;
        }

        #media {
            max-width: 100%;
            max-height: 400px;
            border-radius: 6px;
            margin: 15px 0;
            display: none;
        }

        #media.visible {
            display: block;
        }

        #text {
            font-size: 16px;
            line-height: 1.6;
            margin: 15px 0;
            text-align: left;
        }

        .news-meta {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            font-size: 14px;
            color: var(--color-text-sub);
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #true-btn {
            background-color: var(--color-success);
            color: white;
        }

        #false-btn {
            background-color: var(--color-contrast);
            color: white;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #answer-result {
            font-weight: bold;
            font-size: 20px;
            margin-top: 15px;
            min-height: 30px;
        }

        #answer-result.correct {
            color: var(--color-success);
        }

        #answer-result.incorrect {
            color: var(--color-contrast);
        }

        .results {
            text-align: center;
            padding: 40px 20px;
        }

        .results h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .score {
            font-size: 48px;
            font-weight: bold;
            color: var(--color-contrast);
            margin: 20px 0;
        }

        #restart-btn {
            background-color: var(--color-contrast);
            color: white;
            margin-top: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 20px;
        }
    </style>
</head>
<body>
<div id="daily-container">
    <div class="loading">
        <p>Загрузка квиза...</p>
    </div>
</div>

<script>
let dailyData = [];
let currentIndex = 0;
let results = [];

const containerEl = document.getElementById("daily-container");

function setupButtons() {
    const trueBtn = document.getElementById("true-btn");
    const falseBtn = document.getElementById("false-btn");

    if (trueBtn && falseBtn) {
        trueBtn.addEventListener("click", () => answer(true));
        falseBtn.addEventListener("click", () => answer(false));
    }
}

async function startDaily() {
    try {
        const response = await fetch("/api/daily");
        if (!response.ok) {
            throw new Error("Ошибка загрузки квиза");
        }
        dailyData = await response.json();

        if (dailyData.length === 0) {
            containerEl.innerHTML = `
                <div class="results">
                    <h2>Нет доступных новостей</h2>
                    <p>Добавьте новости для начала квиза</p>
                </div>
            `;
            return;
        }

        currentIndex = 0;
        results = [];
        showQuestion();
    } catch (error) {
        containerEl.innerHTML = `
            <div class="results">
                <h2>Ошибка загрузки</h2>
                <p>${error.message}</p>
                <button id="restart-btn">Попробовать снова</button>
            </div>
        `;
        document.getElementById("restart-btn").addEventListener("click", startDaily);
    }
}

function showQuestion() {
    const news = dailyData[currentIndex];
    const progress = `Вопрос ${currentIndex + 1} из ${dailyData.length}`;

    // Форматирование даты
    let dateStr = "";
    if (news.published_date) {
        const date = new Date(news.published_date);
        dateStr = date.toLocaleDateString('ru-RU');
    }

    containerEl.innerHTML = `
        <div class="progress">${progress}</div>
        <div class="news-card">
            <h2>${news.headline}</h2>
            ${news.media_url ? `<img id="media" class="visible" src="${news.media_url}" alt="Изображение новости">` : '<img id="media" src="" alt="">'}
            ${news.text ? `<p id="text">${news.text}</p>` : ''}
            <div class="news-meta">
                <span>Источник: ${news.source_name || 'Неизвестно'}</span>
                ${dateStr ? `<span>Дата: ${dateStr}</span>` : ''}
            </div>
        </div>
        <div class="buttons">
            <button id="true-btn">✓ Правда</button>
            <button id="false-btn">✗ Фейк</button>
        </div>
        <p id="answer-result"></p>
    `;

    setupButtons();
}

function answer(isReal) {
    const news = dailyData[currentIndex];
    const correct = isReal === news.is_real;
    results.push(correct);

    const resultEl = document.getElementById("answer-result");
    resultEl.innerText = correct ? "✓ Верно!" : "✗ Неверно!";
    resultEl.className = correct ? "correct" : "incorrect";

    document.getElementById("true-btn").disabled = true;
    document.getElementById("false-btn").disabled = true;

    currentIndex++;
    if (currentIndex < dailyData.length) {
        setTimeout(showQuestion, 1500);
    } else {
        setTimeout(showResults, 1500);
    }
}

function showResults() {
    const score = results.filter(Boolean).length;
    const total = results.length;
    const percentage = Math.round((score / total) * 100);

    let message = "";
    if (percentage === 100) {
        message = "Идеально!";
    } else if (percentage >= 80) {
        message = "Отлично!";
    } else if (percentage >= 60) {
        message = "Хорошо!";
    } else if (percentage >= 40) {
        message = "Неплохо!";
    } else {
        message = "Попробуйте ещё раз!";
    }

    containerEl.innerHTML = `
        <div class="results">
            <h2>Викторина завершена!</h2>
            <div class="score">${score} / ${total}</div>
            <p style="font-size: 24px;">${message}</p>
            <p style="font-size: 18px; color: var(--color-text-sub);">
                Правильных ответов: ${percentage}%
            </p>
            <button id="restart-btn">Сыграть ещё раз</button>
        </div>
    `;

    document.getElementById("restart-btn").addEventListener("click", startDaily);
}

window.onload = startDaily;
</script>
</body>
</html>
